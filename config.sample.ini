# forge configuration
#
# Copy to ~/.config/forge/config.ini and edit.
# Validated at startup; forge refuses to run with a layout that could convert
# its own outputs.

[paths]
# Where books waiting to be triaged and converted live.
source_dir = /media/audiobooks/Downloads/__CONVERT

# Finished books land here, ready for tagging and the move into the library.
# Must NOT be inside source_dir.
output_dir = /media/audiobooks/working/tag

# Originals are moved here after a conversion is validated. Nothing is ever
# deleted; this is the undo of last resort.
# Must NOT be inside source_dir.
archive_dir = /media/audiobooks/working/holding_cell

# Where `forge shelve` files finished books, as
# Author/Series/NN - Album/Album (year) [asin].m4b. This is the tree
# Audiobookshelf watches.
#
# Optional: leave it out and everything except `shelve` still works. forge
# never creates it, so a typo fails loudly instead of quietly filling a second
# library beside the real one.
library_dir = /media/audiobooks/Audiobooks

# Where a book whose ASIN is already in the library is set aside instead of
# being shelved. Defaults to `duplicates` inside whatever directory shelve is
# reading, which is excluded from later scans.
# Must NOT be inside library_dir.
duplicates_dir =

[encoding]
# Ceiling for ordinary narration. Dramatised books ignore this cap, since
# preserving a full-cast production is the point of marking it as drama.
max_bitrate = 64
codec = libfdk_aac
fallback_codec = aac

[general]
log_file = /home/jrussell/scripts/forge/forge.log
state_dir = /home/jrussell/.local/share/forge

[safety]
# Copy-then-replace on every tag write. Slower on large files, but a failed
# in-place rewrite of an MP4 container leaves it unplayable.
safe_tag_writes = true

# Unattended runs wait for a file to stop changing before touching it, so a
# download or conversion still in flight is never picked up.
settle_seconds = 5
min_age_seconds = 120

[artwork]
extract_covers = false
cover_dir = /media/audiobooks/working/covers

[audiobookshelf]
# Optional, and read-only: triage uses this to answer "is this book already in
# my library?" by ASIN. Nothing here is ever written to the server.
#
# Leave these blank to keep the credentials out of this file; forge then reads
# AUDIOBOOKSHELF_URL, AUDIOBOOKSHELF_API_KEY and AUDIOBOOKSHELF_LIBRARY_ID from
# the environment, or from a .env file next to this config, in
# ~/.config/forge/.env, or in the forge directory.
url =
api_key =
# Optional. Without it every book library on the server is indexed.
library_id =
